name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Tools/readme-snippets.sh copies every ```swift block in README.md into
      # Examples/ReadmeSnippets.swift, which `swift test` builds with the rest
      # of the Examples target. This step fails if that copy is stale, so a
      # README edit cannot skip the compiler.
      - name: README snippets are current
        run: Tools/readme-snippets.sh --check

      - run: swift test --no-parallel

      # `swift test` compiles for macOS only. kadr-audio shipped six releases
      # whose iOS slice did not compile because nothing here built it.
      #
      # KadrPersistence-Package is a committed shared scheme (.swiftpm/xcode/
      # xcshareddata) that builds the library and the README examples, but no
      # tests. Xcode generates no all-targets scheme for a package with a
      # single library product, and the examples are deliberately not one.
      - name: Build for iOS
        run: xcodebuild -scheme KadrPersistence-Package -destination 'generic/platform=iOS' -quiet build
